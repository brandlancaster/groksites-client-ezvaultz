name: Add crate photo binaries
on:
  push:
    paths:
      - "images/*.webp.b64"
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode WebP photos and remove helpers
        run: |
          set -euo pipefail
          mkdir -p images
          base64 -d images/trunk-closed.webp.b64 > images/trunk-closed.webp
          base64 -d images/trunk-open.webp.b64 > images/trunk-open.webp
          rm -f images/trunk-closed.webp.b64 images/trunk-open.webp.b64
          rm -f .github/workflows/add-crate-photos.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "GSBuilder"
          git config user.email "builder@groksites.com"
          git add -A
          git status
          git commit -m "Add optimized WebP crate photos."
          git push
